# Docker Compose for II-Researcher (Legacy - Separate Containers)
# This is the original configuration with separate containers for each service
# Kept for reference and backward compatibility

services:
  frontend:
    image: ii_researcher/frontend
    ports:
      - "3001:3000"
    
    # Load environment variables from env.test file
    # Create .env for local overrides: cp env.test .env
    env_file:
      - env.test
    
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    image: ii_researcher/api
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    
    # Load environment variables from env.test file
    # Create .env for local overrides: cp env.test .env
    env_file:
      - env.test
    
    # Override specific environment variables
    environment:
      - OPENAI_BASE_URL=http://litellm:4000
    
    command: python api.py
    depends_on:
      - litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"