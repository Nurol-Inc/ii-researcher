services:
  # ============================================================================
  # Unified Container (Project Services Only)
  # Runs Frontend, API, and MCP in a single container
  # Note: LiteLLM or other 3rd-party services should run separately
  # ============================================================================
  ii-researcher:
    image: nurol/ii-researcher:latest
    container_name: ii-researcher
    ports:
      - "3001:3000"  # Frontend
      - "8001:8000"  # API
      - "8765:8765"  # MCP Server (HTTP mode)
    
    # Load all environment variables from env.test file
    # Create .env for local overrides: cp env.test .env
    env_file:
      - env.test
    
    # Override or add specific environment variables if needed
    environment:
      - SERVICE_MODE=all
    
    restart: unless-stopped
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================================================
# Note: This container only includes services from the ii-researcher project.
# For LiteLLM or other 3rd-party services, run them separately:
#
# Example - Run LiteLLM separately:
#   docker run -d -p 4000:4000 \
#     -v $(pwd)/litellm_config.yaml:/app/config.yaml \
#     ghcr.io/berriai/litellm:latest \
#     --config /app/config.yaml
#
# For the legacy separate container setup, see docker-compose-legacy.yml
# ============================================================================
