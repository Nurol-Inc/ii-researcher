[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:api]
command=python api.py
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/ii-researcher/api.err.log
stdout_logfile=/var/log/ii-researcher/api.out.log
priority=100

[program:frontend]
command=node server.js
directory=/app/frontend
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/ii-researcher/frontend.err.log
stdout_logfile=/var/log/ii-researcher/frontend.out.log
environment=PORT=3000,HOSTNAME=0.0.0.0,NODE_ENV=production
priority=200
# Wait for API to start
startsecs=10
